services:
  server:
    container_name: exam-api
    build:
      context: .
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=exam_api.settings
      - DEBUG=True
      - USE_POSTGRES=True
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=teste
      - POSTGRES_PASSWORD=teste
      - POSTGRES_DB=teste
    depends_on:
      db:
        condition: service_healthy
      tests:
        condition: service_completed_successfully
    volumes:
      - ./app:/django/app
    ports:
      - "8000:8000"
    entrypoint:
      - bash
      - /entrypoint.sh

  tests:
    build:
      context: .
    restart: "no"
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=exam_api.settings
      - DEBUG=False
      - USE_POSTGRES=True
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=teste
      - POSTGRES_PASSWORD=teste
      - POSTGRES_DB=teste
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/django/app
    command: ["bash", "-lc", "python manage.py wait_for_postgres && pytest"]

  db:
    restart: always
    image: postgres:latest
    environment:
      - POSTGRES_USER=teste
      - POSTGRES_PASSWORD=teste
      - POSTGRES_DB=teste
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teste -d teste"]
      interval: 3s
      timeout: 5s
      retries: 20
